</style><main><header class="hero"><span class="tag">활동 2 · 생활 속 다양한 로봇</span><h1>로봇 출동! 문제 해결 미션</h1><p>상황에 맞는 로봇을 골라 사람들의 문제를 해결해 봐요.</p></header><section id="start" class="panel"><h2>미션을 선택해요</h2><p>정답을 찾으면 로봇이 출동하고, 어떤 일을 하는지 알려 줘요.</p><div class="actions"><button onclick="start(6)">기본 · 6개 미션</button><button onclick="start(12)">도전 · 12개 미션</button></div></section><section id="game" class="hidden"><div class="actions" style="justify-content:space-between;align-items:center"><strong id="progress"></strong><span id="score"></span><button class="secondary" onclick="home()">처음 화면</button></div><div class="bar"><div id="bar"></div></div><div class="scene"><div id="sceneIcon" style="font-size:48px"></div><div id="question"></div></div><h2>어떤 로봇을 출동시킬까요?</h2><div id="choices" class="options"></div><div id="feedback" class="note hidden" role="status"></div><div class="actions"><button id="next" class="hidden" onclick="advance()">다음 미션</button></div></section><section id="end" class="panel hidden"><h2>모든 미션 완료!</h2><p id="result"></p><div id="review"></div><div class="note"><strong>친구와 이야기해요</strong><p>소방용 로봇과 재난 구조 로봇은 사람의 안전에 어떤 도움을 주나요?</p><p>우리 생활에서 가장 필요하다고 생각하는 로봇은 무엇인가요? 까닭도 말해 봐요.</p></div><div class="actions"><button onclick="start(total)">다시 도전</button><button class="secondary" onclick="home()">처음 화면</button></div></section><style>@keyframes launch{0%{transform:translateX(-15px)}50%{transform:translateX(15px)}100%{transform:translateX(0)}}.good img{animation:launch .55s ease-in-out}</style></main><script>const robots=[{"name": "제조 로봇", "cat": "산업용", "q": "공장에서 자동차 부품을 조립하고 물건을 생산해야 해요.", "why": "공장에서 물건을 생산해요.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKEAAABpCAYAAABS6kNvAAB7eElEQVR4nOy9d5xkVbX3/T2pclVXVVfnNDM9PTknhiEMOQ0KKkowEsxiDpiuXq7XnDAnRFARRFBEchwmMEzO3dM9nXN15XzqpPeP6ip6CCo6Ps/73OviM3R3hX32Oed31l7ht9YWjHDEEqq8CDYb/5Z/yyuJqekMfPN3zPn0W0/62OJJH/Hf8j9SREWm4Zrz/yVjy/+SUadldGyMI4cPMzQ0RDKZRNN1FFmhqspHQ0MDDQ0NtLS04PF4cDqd/8qp/FtOgoT/vJXay87A2Vp3U
